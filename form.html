<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - RoseDana Supreus</title>
    <meta name="description"
      content="WDD 131 – Dynamic Web Fundamentals - RoseDana Supreus - Product Review Form">
    <meta name="author" content="RoseDana Supreus">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-larger.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overlock&display=swap" rel="stylesheet">
    
</head>
<body>
    <main class="review-container">

        <header>
            <h1>Product Review</h1>
        </header>

        <form method="get" action="review.html">

            <div class="form-section">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <div class="form-section">

                <fieldset>

                    <legend>Overall Rating</legend>

                    <div class="rating-container">

                        <div class="rating-option">
                            <span>★</span>
                            <input type="radio" name="rating" id="rating1" value="1" required>
                        </div>

                        <div class="rating-option">
                            <span>★★</span>
                            <input type="radio" name="rating" id="rating2" value="2">
                        </div>

                        <div class="rating-option">
                            <span>★★★</span>
                            <input type="radio" name="rating" id="rating3" value="3">
                        </div>

                        <div class="rating-option">
                            <span>★★★★</span>
                            <input type="radio" name="rating" id="rating4" value="4">
                        </div>

                        <div class="rating-option">
                            <span>★★★★★</span>
                            <input type="radio" name="rating" id="rating5" value="5">
                        </div>

                    </div>
                </fieldset>

            </div>

            <div class="form-section">
                <label for="install-date">Date of Installation</label>
                <input type="date" id="install-date" name="install-date" required>
            </div>

            <div class="form-section">
                <label>
                    Which features did you find useful in the product?
                    <em>(Check all that apply)</em>
                </label>

                <div class="checkbox-group">
                    <label><input type="checkbox" name="features" id="durability" value="Durability"> Durability</label>
                    <label><input type="checkbox" name="features" id="easeOfUse" value="Ease of Use"> Ease of Use</label>
                    <label><input type="checkbox" name="features" id="performance" value="Performance"> Performance</label>
                    <label><input type="checkbox" name="features" id="design" value="Design"> Design</label>
                </div>
            </div>

            <div class="form-section">
                <label for="review">
                    Written Review <span class="optional">(Optional)</span>
                </label>

                <textarea id="review" name="review" rows="6"></textarea>
            </div>

           <div class="form-section">
                <label for="userName">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>
                <input type="text" id="userName" name="userName">
            </div>

            <input type="submit" value="Post Review">

        </form>

        <footer class="footer">
            <p>© <span id="currentyear"></span>  🌄 RoseDana Supreus 🌄 Utah </p>
            <p id="lastModified"></p>
        </footer>

    </main>

    
    
</body>
</html>
